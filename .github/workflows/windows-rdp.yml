name: Windows 2022 RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Username = "rdpuser"
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name $Username -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Action Allow `
            -ErrorAction SilentlyContinue

          Write-Host "RDP configured."

      - name: Windows 10-like desktop preferences
        shell: powershell
        run: |
          # Show file extensions
          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "HideFileExt" `
            -Value 0 `
            -ErrorAction SilentlyContinue

          # Show hidden files
          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "Hidden" `
            -Value 1 `
            -ErrorAction SilentlyContinue

          # Reduce animation effects
          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name "MinAnimate" `
            -Value "0" `
            -ErrorAction SilentlyContinue

          # Performance preference
          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Value 2 `
            -ErrorAction SilentlyContinue

      - name: Install common desktop apps
        shell: powershell
        run: |
          winget install Google.Chrome `
            --accept-package-agreements `
            --accept-source-agreements `
            --silent `
            --disable-interactivity

          winget install 7zip.7zip `
            --accept-package-agreements `
            --accept-source-agreements `
            --silent `
            --disable-interactivity

      - name: Show connection information
        shell: powershell
        run: |
          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WINDOWS RDP READY"
          Write-Host "=========================================="
          Write-Host "Tailscale IP: $ip"
          Write-Host "Username: rdpuser"
          Write-Host "Password: use your RDP_PASSWORD secret"
          Write-Host "=========================================="
          Write-Host ""

          tailscale status

      - name: Keep RDP session alive
        shell: powershell
        run: |
          $EndTime = (Get-Date).AddMinutes(345)

          while ((Get-Date) -lt $EndTime) {
              $Remaining = New-TimeSpan `
                -Start (Get-Date) `
                -End $EndTime

              Write-Host (
                "RDP active - {0}h {1}m remaining" -f `
                $Remaining.Hours,
                $Remaining.Minutes
              )

              Start-Sleep -Seconds 300
          }

          Write-Host "Session ending."
