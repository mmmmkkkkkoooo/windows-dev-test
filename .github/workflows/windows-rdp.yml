name: Windows 2022 RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Username = "rdpuser"
          $SecurePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name $Username -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Remove-NetFirewallRule `
            -DisplayName "RDP Tailscale Only" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Action Allow

          Write-Host "RDP configured successfully."

      - name: Windows desktop preferences
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "HideFileExt" `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "Hidden" `
            -Value 1 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name "MinAnimate" `
            -Value "0" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Value 2 `
            -ErrorAction SilentlyContinue

      - name: Install Chrome and 7-Zip
        shell: powershell
        run: |
          choco install googlechrome -y --no-progress
          choco install 7zip -y --no-progress

      - name: Show RDP connection information
        shell: powershell
        run: |
          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WINDOWS RDP READY"
          Write-Host "=========================================="
          Write-Host "Tailscale IP: $ip"
          Write-Host "Username: rdpuser"
          Write-Host "Password: your RDP_PASSWORD secret"
          Write-Host "=========================================="
          Write-Host ""

          tailscale status

      - name: Keep RDP session alive
        shell: powershell
        run: |
          $EndTime = (Get-Date).AddMinutes(345)

          while ((Get-Date) -lt $EndTime) {

              $Remaining = New-TimeSpan `
                -Start (Get-Date) `
                -End $EndTime

              Write-Host (
                  "RDP active - approximately {0}h {1}m remaining" -f `
                  $Remaining.Hours,
                  $Remaining.Minutes
              )

              Start-Sleep -Seconds 300
          }

          Write-Host "RDP session finished."
